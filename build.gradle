plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric maven is added by Loom automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Not a dependency of the mod. It is only on the dev/test runtime classpath so the tests run with Fabric API's
    // PacketEncoder mixins (fabric-networking-api-v1, fabric-recipe-api-v1) applied, as on a real server.
    // Loom has no modTestImplementation, so modLocalRuntime is the way to get a mod onto the test runtime classpath.
    modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JUnit 5 plus a Knot launcher session, so Minecraft classes and our mixins are available in tests.
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

tasks.named('test', Test) {
    useJUnitPlatform {
        // EncodeOnceBenchmarkTest is opt-in: ./gradlew test -PrbsBench --tests '*EncodeOnceBenchmarkTest' --no-daemon
        if (!project.hasProperty('rbsBench')) {
            excludeTags 'benchmark'
        }
    }
    // fabric-loader-junit defaults to the client side; the mod is "environment": "server", so its mixins would not load.
    systemProperty 'fabric.side', 'server'
    if (project.hasProperty('rbsBench')) {
        // The benchmark builds a 9 MB book several times and prints its results to the console.
        maxHeapSize = '3g'
        outputs.upToDateWhen { false }
        testLogging.showStandardStreams = true
        ['rbsBench.rounds', 'rbsBench.warmup', 'rbsBench.datasets'].each { key ->
            if (project.hasProperty(key)) {
                systemProperty key, project.property(key)
            }
        }
    }
    testLogging {
        exceptionFormat = 'full'
        events 'passed', 'skipped', 'failed'
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
